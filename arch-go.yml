# Package dependency rules, checked by `just arch`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the build file language is text in, syntax out. It knows nothing of
  # ours and never touches a process, the network or the kernel
  - package: '**.internal.imagefile$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the plan checks what the build file says before anything is built. It
  # knows the language and nothing else of ours, and it never touches a
  # process, the network or the kernel
  - package: '**.internal.plan$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.imagefile$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # a command only wires, what it needs of ours lives under internal
  - package: '**.cmd.**'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.**'
