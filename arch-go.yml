# Package dependency rules, checked by `just arch`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the build file language is text in, syntax out. It knows nothing of
  # ours and never touches a process, the network or the kernel
  - package: '**.internal.imagefile$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the plan checks what the build file says and keys every step before
  # anything is built. It knows the language and nothing else of ours, and it
  # never touches a process, the network or the kernel. What it needs from
  # outside the build file reaches it through its interfaces
  - package: '**.internal.plan$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.imagefile$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # the build context reads what a COPY names, below one directory of the
  # host and never outside it. It knows nothing of ours, and it never touches
  # a process, the network or the kernel. Without syscall it cannot even see
  # an owner or an extended attribute, which must not reach a digest
  - package: '**.internal.buildcontext$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the version reads what the Go toolchain wrote into the binary and
  # nothing else
  - package: '**.internal.version$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the listing writes a plan out for eyes and for diff. It knows the plan
  # and the language, writes to the writer it is handed and opens nothing
  - package: '**.internal.listing$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.plan$'
        - '**.internal.imagefile$'
    shouldNotDependsOn:
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the base image fetches what a FROM names from the network into miso's
  # cache and hashes it. It knows nothing of ours, never starts a process
  # and never touches the kernel. It is the one package that may use net
  - package: '**.internal.baseimage$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - syscall
  # the protocol is what miso and its agent say to each other. It knows
  # nothing of ours and works on the reader and writer it is handed, so
  # which connection carries it is decided elsewhere
  - package: '**.internal.protocol$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the build is the host's side of a build. It turns a plan into what the
  # agent is asked. It knows the plan, the language and the protocol, and
  # which connection carries the protocol is decided elsewhere
  - package: '**.internal.build$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.plan$'
        - '**.internal.imagefile$'
        - '**.internal.protocol$'
    shouldNotDependsOn:
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the disk reads the partition table of a disk from the reader it is
  # handed. It knows nothing of ours, opens nothing and never touches a
  # process, the network or the kernel
  - package: '**.internal.disk$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the fstab reads the fstab of a base image from the reader it is handed.
  # It knows nothing of ours, opens nothing and never touches a process, the
  # network or the kernel
  - package: '**.internal.fstab$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the tree copies a directory tree as it is. It knows nothing of ours and
  # never starts a process or touches the network
  - package: '**.internal.tree$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the layer keeps the layers on the agent's cache disk. It knows nothing
  # of ours and never touches a process, the network or the kernel
  - package: '**.internal.layer$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the vmtest runs tests as the init of a VM, which takes the kernel. It
  # knows nothing of ours and never starts a process or touches the network
  - package: '**.internal.vmtest$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the link speaks route netlink with the kernel about cards, addresses and
  # routes. It knows nothing of ours and never opens a connection or starts
  # a process. net/netip holds only addresses as values, so the rule names
  # net alone
  - package: '**.internal.link$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - '^net$'
  # the basemount mounts a base disk's root, found through disk, as its
  # fstab read through fstab describes it. It touches the kernel, and never
  # starts a process or touches the network
  - package: '**.internal.basemount$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.disk$'
        - '**.internal.fstab$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the agent is the builder VM's side of a build. It does what the host asks
  # through the protocol, mounts base disks through basemount, copies them
  # through tree, keeps layers through layer and sets up the network of a
  # run through link. It touches the kernel and starts the commands of a
  # build, and never opens a connection itself. net/netip holds only
  # addresses as values, so the rule names net alone
  - package: '**.internal.agent$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.protocol$'
        - '**.internal.basemount$'
        - '**.internal.tree$'
        - '**.internal.layer$'
        - '**.internal.link$'
    shouldNotDependsOn:
      standard:
        - '^net$'
  # a command only wires, what it needs of ours lives under internal
  - package: '**.cmd.**'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.**'
