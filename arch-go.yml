# Package dependency rules, checked by `just arch`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the build file language is text in, syntax out. It knows nothing of
  # ours and never touches a process, the network or the kernel
  - package: '**.internal.imagefile$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the plan checks what the build file says and keys every step before
  # anything is built. It knows the language and nothing else of ours, and it
  # never touches a process, the network or the kernel. What it needs from
  # outside the build file reaches it through its interfaces
  - package: '**.internal.plan$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.imagefile$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # the copy digest says what a COPY carries and what its digest covers. It
  # knows nothing of ours, opens nothing and never touches a process, the
  # network or the kernel. Its entry has no field for an owner, a time or an
  # extended attribute, so none can reach a digest
  - package: '**.internal.copydigest$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the build context reads what a COPY names, below one directory of the
  # host and never outside it. It knows only the copy digest of ours, which
  # decides what may reach a digest. It touches the kernel only to read
  # safely, and never a process or the network
  - package: '**.internal.buildcontext$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.copydigest$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the files of a copy come from the build context and leave in the
  # agent's form, nothing else
  - package: '**.internal.contextfiles$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.buildcontext$'
        - '**.internal.protocol$'
    shouldNotDependsOn:
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the version reads what the Go toolchain wrote into the binary and
  # nothing else
  - package: '**.internal.version$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the console reads and writes the serial port of a machine it is handed
  # as a reader and a writer. It knows nothing of ours, opens nothing and
  # never touches a process, the network or the kernel, so it is tested
  # without a machine
  - package: '**.internal.console$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the port carries connections over one stream it is handed, one virtio
  # serial port of the VM. It knows nothing of ours, opens nothing and never
  # touches a process, the network or the kernel, so it is tested without a
  # machine
  - package: '**.internal.vport$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the listing writes a plan out for eyes and for diff. It knows the plan
  # and the language, writes to the writer it is handed and opens nothing
  - package: '**.internal.listing$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.plan$'
        - '**.internal.imagefile$'
    shouldNotDependsOn:
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the download fetches bytes into miso's cache and keeps them under the
  # digest of what arrived. It knows nothing of ours, never starts a process
  # and never touches the kernel. It is the one package that may use net
  - package: '**.internal.download$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - syscall
  # the downloadtest puts bytes into a download store for tests. It knows
  # nothing of ours and never fetches anything
  - package: '**.internal.download.downloadtest$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the base image knows what a FROM names and has the download fetch it. It
  # never opens a connection itself, starts a process or touches the kernel
  - package: '**.internal.baseimage$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.download$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # the protocol is what miso and its agent say to each other. It knows
  # nothing of ours and works on the reader and writer it is handed, so
  # which connection carries it is decided elsewhere
  - package: '**.internal.protocol$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the build is the host's side of a build. It turns a plan into what the
  # agent is asked. It knows the plan, the language and the protocol, and
  # which connection carries the protocol is decided elsewhere
  - package: '**.internal.build$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.plan$'
        - '**.internal.imagefile$'
        - '**.internal.protocol$'
    shouldNotDependsOn:
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the disk reads the partition table of a disk from the reader it is
  # handed. It knows nothing of ours, opens nothing and never touches a
  # process, the network or the kernel
  - package: '**.internal.disk$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the cachedisk makes the host's file the builder keeps its layers on. It
  # knows nothing of ours and never touches the network
  - package: '**.internal.cachedisk$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - net
  # the fstab reads the fstab of a base image from the reader it is handed.
  # It knows nothing of ours, opens nothing and never touches a process, the
  # network or the kernel
  - package: '**.internal.fstab$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the tree copies a directory tree as it is, and what a copy takes from a
  # stage into an image through the place. It knows nothing else of ours and
  # never starts a process or touches the network
  - package: '**.internal.tree$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.place$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the place puts what a copy carries into the root file system of an
  # image. It knows nothing of ours and never starts a process or touches
  # the network
  - package: '**.internal.place$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the layer keeps the layers on the agent's cache disk. It knows nothing
  # of ours, never touches a process or the network, and asks the kernel
  # only to put its file system on the disk before a key names a layer
  - package: '**.internal.layer$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
        - syscall
  # the boot readies a VM for its init, which takes the kernel. It knows
  # nothing of ours and never starts a process or touches the network
  - package: '**.internal.boot$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the vmtest runs tests as the init of a VM, readied through boot. It
  # never starts a process or touches the network
  - package: '**.internal.vmtest$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.boot$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the builder talks to the agent through connections it is handed and
  # describes its VM to the qemu driver. It never starts a process, dials
  # or touches the network itself
  - package: '**.internal.builder$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.build$'
        - '**.internal.protocol$'
        - '**.internal.qemu$'
        - '**.internal.builderkernel$'
        - '**.internal.initramfs$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - '^net$'
        - syscall
  # the kvmtest readies the builder VM of the kvm tests. It never starts a
  # process itself, the tests start QEMU through the qemu driver
  - package: '**.internal.kvmtest$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.baseimage$'
        - '**.internal.builder$'
        - '**.internal.builderkernel$'
        - '**.internal.download$'
        - '**.internal.firmware$'
        - '**.internal.qemu$'
    shouldNotDependsOn:
      standard:
        - os/exec
  # the check boots an image miso made and runs its checks in it. It hands
  # the image what it needs as credentials, and starts QEMU only through
  # the qemu driver
  - package: '**.internal.check$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.firmware$'
        - '**.internal.qemu$'
        - '**.internal.vsock$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the vsock connects the host and its builder VM. It knows nothing of ours
  # and never starts a process or touches the network
  - package: '**.internal.vsock$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the reach connects the host to the agent of its builder VM, over vsock
  # or over the VM's virtio port. It knows the two ways and nothing else of
  # ours, and never starts a process or touches the network
  - package: '**.internal.reach$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.vsock$'
        - '**.internal.vport$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the guest port finds the agent's virtio port inside the VM by reading
  # sysfs. It knows nothing of ours and never starts a process or touches
  # the network
  - package: '**.internal.guestport$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - net
  # the initramfs writes the initial ramfs of the builder VM to the writer
  # it is handed. It knows nothing of ours, opens nothing and never touches
  # a process, the network or the kernel
  - package: '**.internal.initramfs$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the deb reads the files out of a Debian package it is handed. It knows
  # nothing of ours and never opens, fetches or starts anything
  - package: '**.internal.deb$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the debtest makes Debian packages for tests, in memory
  - package: '**.internal.deb.debtest$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the firmware takes miso's pinned OVMF package apart into what a check
  # boots through. It has the download fetch the package, and never starts
  # a process, opens a connection or touches the kernel
  - package: '**.internal.firmware$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.deb$'
        - '**.internal.download$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # the builder kernel takes miso's pinned Debian package apart into the
  # kernel the builder VM boots and the modules its agent loads. It has the
  # download fetch the package, and never starts a process, opens a
  # connection or touches the kernel
  - package: '**.internal.builderkernel$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.deb$'
        - '**.internal.download$'
        - '**.internal.initramfs$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
        - syscall
  # the qemu starts the builder VM as a process on the host. It knows nothing
  # of ours and never touches the network itself, the VM's card is QEMU's
  - package: '**.internal.qemu$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - net
  # the link speaks route netlink with the kernel about cards, addresses and
  # routes. It knows nothing of ours and never opens a connection or starts
  # a process. net/netip holds only addresses as values, so the rule names
  # net alone
  - package: '**.internal.link$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os/exec
        - '^net$'
  # the basemount mounts a base disk's root, found through disk, as its
  # fstab read through fstab describes it. It touches the kernel, and never
  # starts a process or touches the network
  - package: '**.internal.basemount$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.disk$'
        - '**.internal.fstab$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # the runnet gives a run its network through link, as the protocol hands
  # it, and fences the builder's card off through go-tc. It never opens a
  # connection or starts a process. net is not banned here, unlike in its
  # neighbours, because go-tc names a flower key's address as net.IP, so
  # the package carries net for its types and the rule can no longer say
  # that it cannot dial
  - package: '**.internal.runnet$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.protocol$'
        - '**.internal.link$'
    shouldNotDependsOn:
      standard:
        - os/exec
  # the sandbox runs the command of a run in a root of its own, as the
  # protocol hands it, and gives it its network through runnet. It touches
  # the kernel and starts the commands of a build, and never opens a
  # connection itself
  - package: '**.internal.sandbox$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.protocol$'
        - '**.internal.runnet$'
    shouldNotDependsOn:
      standard:
        - net
  # the agent is the builder VM's side of a build. It does what the host asks
  # through the protocol, finds its cache disk through disk, mounts base
  # disks through basemount, copies them through tree, puts what a COPY
  # sends through place and checks it through copydigest, keeps layers through layer and runs steps on them
  # through sandbox. It touches the kernel, and never starts a process or
  # opens a connection itself
  - package: '**.internal.agent$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.protocol$'
        - '**.internal.disk$'
        - '**.internal.basemount$'
        - '**.internal.tree$'
        - '**.internal.place$'
        - '**.internal.copydigest$'
        - '**.internal.layer$'
        - '**.internal.sandbox$'
    shouldNotDependsOn:
      standard:
        - os/exec
        - net
  # a tool of the test harness makes what miso makes, through miso's own code
  - package: '**.hack.**'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.cachedisk$'
  # a command only wires, what it needs of ours lives under internal
  - package: '**.cmd.**'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.**'
