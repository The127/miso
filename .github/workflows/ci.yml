name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # lets the codecov upload authenticate through oidc, without a secret
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      # install only, `just lint` runs it so that ci and the hooks agree
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      # just test-cli runs the built miso from the outside
      - uses: bats-core/bats-action@4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - run: just ci
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.out
          flags: unit
