version: 2

builds:
  - main: ./cmd/miso
    binary: miso
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

# the kernel and the firmware are not shipped, a build fetches them by digest
nfpms:
  - package_name: miso
    formats:
      - deb
      - rpm
    maintainer: karo <karolinkostial@gmail.com>
    description: Dockerfile-style builder for systemd-based operating systems.
    homepage: https://github.com/The127/miso
    license: AGPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/miso/LICENSE
    overrides:
      deb:
        dependencies:
          - qemu-system-x86
      rpm:
        dependencies:
          - qemu-system-x86-core

checksum:
  name_template: checksums.txt

# release-please writes the notes
changelog:
  disable: true

release:
  prerelease: auto
