version: 2

# one build per arch, so each package can depend on the qemu of its arch
builds:
  - id: amd64
    main: ./cmd/miso
    binary: miso
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: arm64
    main: ./cmd/miso
    binary: miso
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

# the kernel and the firmware are not shipped, a build fetches them by digest
nfpms:
  - &package
    id: amd64
    ids: [amd64]
    package_name: miso
    formats:
      - deb
      - rpm
    maintainer: karo <karolinkostial@gmail.com>
    description: Dockerfile-style builder for systemd-based operating systems.
    homepage: https://github.com/The127/miso
    license: AGPL-3.0-or-later
    contents:
      - src: LICENSE
        dst: /usr/share/doc/miso/LICENSE
    overrides:
      deb:
        dependencies:
          - qemu-system-x86
      rpm:
        dependencies:
          - qemu-system-x86-core
  - <<: *package
    id: arm64
    ids: [arm64]
    overrides:
      deb:
        dependencies:
          - qemu-system-arm
      rpm:
        dependencies:
          - qemu-system-aarch64-core

checksum:
  name_template: checksums.txt

# keyless: the workflow's own identity signs, there is no key to keep
signs:
  - cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

# release-please writes the notes
changelog:
  disable: true

release:
  prerelease: auto
